[build-system]
requires = ["setuptools>=84.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lino-objects-codec"
version = "0.2.0"
description = "A library to encode/decode objects to/from links notation"
readme = "README.md"
requires-python = ">=3.13"
license = "Unlicense"
license-files = ["LICENSE"]
authors = [
    {name = "Link Foundation"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "links-notation>=0.16.1,<0.17.0",
]

[project.optional-dependencies]
# Floors, not pins: each is the current major, so a fresh `pip install -e
# ".[dev]"` resolves to what CI runs instead of to a years-old release that
# lints and type-checks by different rules. See issue #47.
dev = [
    "pytest>=9.1",
    "pytest-cov>=7.1",
    "ruff>=0.16.5",
    "mypy>=2.3",
    "scriv[toml]>=1.8",
]

[project.urls]
Homepage = "https://github.com/link-foundation/lino-objects-codec"
Repository = "https://github.com/link-foundation/lino-objects-codec"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "-v --cov=link_notation_objects_codec --cov-report=term-missing"

[tool.ruff]
line-length = 100
# Matches `requires-python` above: an older target silently keeps deprecated
# typing constructs passing review.
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM"]
ignore = []

# Kept in pyproject.toml on purpose: ruff reads exactly one configuration file,
# so a `.ruff.toml` next to this file would replace everything above rather than
# add to it, and the rule selection would silently become ruff's default one.
[tool.ruff.lint.isort]
known-first-party = ["link_notation_objects_codec"]

[tool.mypy]
python_version = "3.13"
warn_return_any = false
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true

# Scriv configuration for changelog management
# Similar to @changesets/cli but for Python projects
[tool.scriv]
# Fragment format (markdown for better GitHub compatibility)
format = "md"
# Fragment directory
fragment_directory = "changelog.d"
# Changelog file
output_file = "CHANGELOG.md"
# Categories for changelog entries
categories = [
    "Removed",
    "Added",
    "Changed",
    "Deprecated",
    "Fixed",
    "Security",
]
# Version header format
entry_title_template = "## [{{ version }}] - {{ date.strftime('%Y-%m-%d') }}"
# Insert marker (where new entries go)
insert_marker = "<!-- scriv-insert-here -->"
# Main branch name
main_branches = ["main"]
# New fragment template
new_fragment_template = """file:changelog.d/fragment_template.md.j2
"""
