files: ^python/
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: check-toml
      - id: debug-statements

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.5
    hooks:
      - id: ruff-check
        args: [--config, python/pyproject.toml, --fix, --exit-non-zero-on-fix]
      - id: ruff-format
        args: [--config, python/pyproject.toml]

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.4.1
    hooks:
      - id: mypy
        additional_dependencies: [pytest==9.2.0, links-notation==0.31.5]
        args: [--config-file, python/pyproject.toml, --strict, --ignore-missing-imports]
