name: Rust CI/CD

on:
  push:
    branches:
      - main
    paths:
      - 'rust/**'
      - '.github/workflows/rust.yml'
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'rust/**'
      - '.github/workflows/rust.yml'
  workflow_dispatch:
    inputs:
      release_mode:
        description: 'Manual release mode'
        required: true
        type: choice
        default: 'instant'
        options:
          - instant
          - changelog-pr
      bump_type:
        description: 'Version bump type'
        required: true
        type: choice
        # Best practice #17: `gh workflow run` cannot fill a form, and a
        # required input without a default makes the dispatch API answer
        # HTTP 422 before the run exists.
        default: patch
        options:
          - patch
          - minor
          - major
      description:
        description: 'Release description (optional)'
        required: false
        type: string

# Least privilege by default (best practice #10 / template parity): individual
# release jobs raise this to `contents: write` where they need it.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

jobs:
  # === DETECT CHANGES - determines which jobs should run ===
  detect-changes:
    timeout-minutes: 10
    # Read-only check: a newer run supersedes this one.
    concurrency:
      group: check-${{ github.workflow }}-${{ github.ref }}-detect-changes
      cancel-in-progress: true
    name: Detect Changes
    runs-on: ubuntu-24.04
    if: github.event_name != 'workflow_dispatch'
    outputs:
      rs-changed: ${{ steps.changes.outputs.rs-changed }}
      toml-changed: ${{ steps.changes.outputs.toml-changed }}
      mjs-changed: ${{ steps.changes.outputs.mjs-changed }}
      docs-changed: ${{ steps.changes.outputs.docs-changed }}
      workflow-changed: ${{ steps.changes.outputs.workflow-changed }}
      any-code-changed: ${{ steps.changes.outputs.any-code-changed }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Detect changes
        id: changes
        working-directory: ./rust
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GITHUB_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/detect-code-changes.mjs

  # === CHANGELOG CHECK - only runs on PRs with code changes ===
  # Docs-only PRs (./docs folder, markdown files) don't require changelog fragments
  changelog:
    timeout-minutes: 10
    # Read-only check: a newer run supersedes this one.
    concurrency:
      group: check-${{ github.workflow }}-${{ github.ref }}-changelog
      cancel-in-progress: true
    name: Changelog Fragment Check
    runs-on: ubuntu-24.04
    needs: [detect-changes]
    if: github.event_name == 'pull_request' && needs.detect-changes.outputs.any-code-changed == 'true'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      # Best practice #7: the `refs/pull/N/merge` preview goes stale as soon as
      # the base branch moves, so checks would validate code that is not what
      # will actually land. Merge the latest base branch first.
      - name: Simulate fresh merge with base branch (PR only)
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        # Explicit shell: some of these jobs run on Windows runners, where
        # the default shell is PowerShell.
        shell: bash
        run: bash scripts/simulate-fresh-merge.sh

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Check for changelog fragments
        working-directory: ./rust
        env:
          GITHUB_BASE_REF: ${{ github.base_ref }}
          # Dependabot PRs are exempt (issue #71); decided from the author,
          # not from the spoofable branch name.
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: node scripts/check-changelog-fragment.mjs

  # === VERSION CHECK - prevents manual version modification in PRs ===
  # This ensures versions are only modified by the automated release pipeline
  version-check:
    timeout-minutes: 10
    # Read-only check: a newer run supersedes this one.
    concurrency:
      group: check-${{ github.workflow }}-${{ github.ref }}-version-check
      cancel-in-progress: true
    name: Version Modification Check
    runs-on: ubuntu-24.04
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Check for manual version changes
        working-directory: ./rust
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_HEAD_REF: ${{ github.head_ref }}
          GITHUB_BASE_REF: ${{ github.base_ref }}
        run: node scripts/check-version-modification.mjs

  # === LINT AND FORMAT CHECK ===
  # Lint runs independently of changelog check - it's a fast check that should always run
  lint:
    timeout-minutes: 20
    # Read-only check: a newer run supersedes this one.
    concurrency:
      group: check-${{ github.workflow }}-${{ github.ref }}-lint
      cancel-in-progress: true
    name: Lint and Format Check
    runs-on: ubuntu-24.04
    needs: [detect-changes]
    # Note: !cancelled() is required because detect-changes is skipped on workflow_dispatch
    if: >-
      ${{
      !cancelled() && (
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      needs.detect-changes.outputs.rs-changed == 'true' ||
      needs.detect-changes.outputs.toml-changed == 'true' ||
      needs.detect-changes.outputs.mjs-changed == 'true' ||
      needs.detect-changes.outputs.docs-changed == 'true' ||
      needs.detect-changes.outputs.workflow-changed == 'true'
      )
      }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history: the merge simulation below needs the base branch.
          fetch-depth: 0
          persist-credentials: false

      # Best practice #7: the `refs/pull/N/merge` preview goes stale as soon as
      # the base branch moves, so checks would validate code that is not what
      # will actually land. Merge the latest base branch first.
      - name: Simulate fresh merge with base branch (PR only)
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        # Explicit shell: some of these jobs run on Windows runners, where
        # the default shell is PowerShell.
        shell: bash
        run: bash scripts/simulate-fresh-merge.sh

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master branch @ 2026-10-16
        with:
          # The `stable` branch ref supplied this default; it is restated because
          # the action is hash-pinned to a master commit (issue #75: the stable
          # branch is rebuilt per release, so its old commits turn unreachable).
          toolchain: stable
          components: rustfmt, clippy

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Cache cargo dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            rust/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('rust/Cargo.lock') }}

      - name: Check formatting
        working-directory: ./rust
        run: cargo fmt --check

      - name: Run clippy
        working-directory: ./rust
        run: cargo clippy --all-targets --all-features

      - name: Check file size limit
        working-directory: ./rust
        run: node scripts/check-file-size.mjs

      - name: Run CI script tests
        working-directory: ./rust
        run: node --test scripts/*.test.mjs

  # === TEST ===
  # Test runs independently of changelog check
  test:
    timeout-minutes: 45
    # Read-only check: a newer run supersedes this one.
    concurrency:
      group: check-${{ github.workflow }}-${{ github.ref }}-test-${{ matrix.os }}
      cancel-in-progress: true
    name: Test (Rust on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: [detect-changes, changelog]
    # Run if: push event, OR changelog succeeded, OR changelog was skipped (docs-only PR)
    if: ${{ !cancelled() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || needs.changelog.result == 'success' || needs.changelog.result == 'skipped') }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history: the merge simulation below needs the base branch.
          fetch-depth: 0
          persist-credentials: false

      # Best practice #7: the `refs/pull/N/merge` preview goes stale as soon as
      # the base branch moves, so checks would validate code that is not what
      # will actually land. Merge the latest base branch first.
      - name: Simulate fresh merge with base branch (PR only)
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        # Explicit shell: some of these jobs run on Windows runners, where
        # the default shell is PowerShell.
        shell: bash
        run: bash scripts/simulate-fresh-merge.sh

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master branch @ 2026-10-16
        with:
          # The `stable` branch ref supplied this default; it is restated because
          # the action is hash-pinned to a master commit (issue #75: the stable
          # branch is rebuilt per release, so its old commits turn unreachable).
          toolchain: stable

      - name: Cache cargo dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            rust/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('rust/Cargo.lock') }}

      - name: Run tests
        working-directory: ./rust
        run: cargo test --all-features --verbose

      - name: Run doc tests
        working-directory: ./rust
        run: cargo test --all-features --doc --verbose

      - name: Run feature-disabled tests
        working-directory: ./rust
        run: cargo test --no-default-features --verbose

      - name: Run examples
        working-directory: ./rust
        run: |
          cargo run --example basic_usage
          cargo run --example append_only_log
          cargo run --all-features --example json_bridge

  # === BUILD ===
  # Build package - only runs if lint and test pass
  build:
    timeout-minutes: 30
    # Read-only check: a newer run supersedes this one.
    concurrency:
      group: check-${{ github.workflow }}-${{ github.ref }}-build
      cancel-in-progress: true
    name: Build Package
    runs-on: ubuntu-24.04
    needs: [lint, test]
    if: ${{ !cancelled() && needs.lint.result == 'success' && needs.test.result == 'success' }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history: the merge simulation below needs the base branch.
          fetch-depth: 0
          persist-credentials: false

      # Best practice #7: the `refs/pull/N/merge` preview goes stale as soon as
      # the base branch moves, so checks would validate code that is not what
      # will actually land. Merge the latest base branch first.
      - name: Simulate fresh merge with base branch (PR only)
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        # Explicit shell: some of these jobs run on Windows runners, where
        # the default shell is PowerShell.
        shell: bash
        run: bash scripts/simulate-fresh-merge.sh

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master branch @ 2026-10-16
        with:
          # The `stable` branch ref supplied this default; it is restated because
          # the action is hash-pinned to a master commit (issue #75: the stable
          # branch is rebuilt per release, so its old commits turn unreachable).
          toolchain: stable

      - name: Cache cargo dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            rust/target/
          key: ${{ runner.os }}-cargo-build-${{ hashFiles('rust/Cargo.lock') }}

      - name: Build release
        working-directory: ./rust
        run: cargo build --release

      - name: Package crate
        working-directory: ./rust
        run: cargo package --list

  # === AUTO RELEASE ===
  # Automatic release on push to main using changelog fragments
  auto-release:
    timeout-minutes: 60
    # Writer: every job in the repository that pushes commits, tags or
    # packages shares this group, so releases queue instead of racing, and a
    # started release is never cancelled mid-publish.
    concurrency:
      group: main-writer-${{ github.repository }}
      cancel-in-progress: false
      queue: max
    name: Auto Release
    needs: [lint, test, build]
    if: >-
      ${{
      !cancelled() &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.build.result == 'success'
      }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      # crates.io trusted publishing (issue #73): the auth step below trades
      # this job's GitHub OIDC token for a short-lived publish token.
      id-token: write
    steps:
      # This job writes to the repository (a release commit and tag, or a
      # release PR branch), so the checkout explicitly persists credentials.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master branch @ 2026-10-16
        with:
          # The `stable` branch ref supplied this default; it is restated because
          # the action is hash-pinned to a master commit (issue #75: the stable
          # branch is rebuilt per release, so its old commits turn unreachable).
          toolchain: stable

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Configure git
        working-directory: ./rust
        run: node scripts/git-config.mjs

      - name: Determine bump type from changelog fragments
        id: bump_type
        working-directory: ./rust
        run: node scripts/get-bump-type.mjs

      - name: Check if release is needed
        id: release_check
        working-directory: ./rust
        env:
          HAS_FRAGMENTS: ${{ steps.bump_type.outputs.has_fragments }}
        run: node scripts/check-release-needed.mjs

      - name: Collect changelog and bump version
        id: version
        if: steps.release_check.outputs.should_release == 'true' && steps.release_check.outputs.skip_bump != 'true'
        working-directory: ./rust
        env:
          BUMP_TYPE: ${{ steps.bump_type.outputs.bump_type }}
        run: |
          node scripts/version-and-commit.mjs \
            --bump-type "${BUMP_TYPE}"

      - name: Get current version
        id: current_version
        if: steps.release_check.outputs.should_release == 'true'
        working-directory: ./rust
        run: |
          VERSION=$(grep -Po '(?<=^version = ")[^"]*' Cargo.toml)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build release
        if: steps.release_check.outputs.should_release == 'true'
        working-directory: ./rust
        run: cargo build --release

      # Issue #73, organization policy: trusted publishing (OIDC) first, the
      # token secret only as a fallback. The exchange fails while crates.io has
      # no trusted publisher for this repository and rust.yml; continue-on-error
      # lets the publish step fall back to CARGO_REGISTRY_TOKEN / CARGO_TOKEN,
      # and that step still fails when neither credential works, so nothing is
      # masked. The action's post step revokes the temporary token.
      - name: Authenticate with crates.io (trusted publishing)
        id: crates_auth
        if: steps.release_check.outputs.should_release == 'true'
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
        continue-on-error: true

      - name: Publish to crates.io
        if: steps.release_check.outputs.should_release == 'true'
        working-directory: ./rust
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates_auth.outputs.token || secrets.CARGO_REGISTRY_TOKEN || secrets.CARGO_TOKEN }}
          TRUSTED_PUBLISHING: ${{ steps.crates_auth.outcome }}
        run: |
          CRATE=$(sed -n 's|^name = "\(.*\)"|\1|p' Cargo.toml | head -1)
          SETTINGS="https://crates.io/crates/${CRATE}/settings"
          PUBLISHER="owner ${GITHUB_REPOSITORY%%/*}, repository ${GITHUB_REPOSITORY#*/}, workflow rust.yml, no environment"
          if [ "$TRUSTED_PUBLISHING" = success ]; then
            echo "Publishing with a crates.io trusted publishing (OIDC) token."
          else
            echo "::warning title=crates.io trusted publishing unavailable::OIDC token exchange outcome: ${TRUSTED_PUBLISHING:-skipped}. Falling back to the CARGO_REGISTRY_TOKEN / CARGO_TOKEN secret. To publish without a long-lived token, register the trusted publisher at ${SETTINGS} (Trusted Publishing -> Add -> GitHub: ${PUBLISHER})."
          fi
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then
            echo "::error title=crates.io credentials missing::Cannot publish to crates.io: trusted publishing is unavailable and no token secret is set."
            echo ""
            echo "How to fix (either one is enough; trusted publishing is preferred):"
            echo "  1. Trusted publishing, with no secret to rotate: as a crate owner open"
            echo "     ${SETTINGS} -> Trusted Publishing -> Add -> GitHub"
            echo "     and enter: ${PUBLISHER}."
            echo "     Docs: https://crates.io/docs/trusted-publishing"
            echo "  2. Token fallback: generate a token at https://crates.io/settings/tokens"
            echo "     (scope 'publish-update' for this crate) and add it to this repo at"
            echo "     Settings -> Secrets and variables -> Actions -> New repository secret"
            echo "     Name: CARGO_REGISTRY_TOKEN  (CARGO_TOKEN is also accepted as a fallback)"
            echo "  3. Re-run this workflow."
            echo ""
            echo "See docs/case-studies/issue-75/README.md (trusted publishing),"
            echo "    docs/case-studies/issue-29/README.md (credentials) and"
            echo "    docs/case-studies/issue-25/README.md (publishing pipeline)."
            exit 1
          fi
          # `cargo publish` exits non-zero on retry if the version already exists; we tolerate that
          # because the registry probe in release_check already proved the version is missing, so a
          # late "already exists" error means a parallel run won the race -- treat as success.
          if ! OUT=$(cargo publish 2>&1); then
            echo "$OUT"
            if echo "$OUT" | grep -qE 'already (uploaded|exists)'; then
              echo "::warning::Version was published by another run between probe and publish; treating as success."
              exit 0
            fi
            if echo "$OUT" | grep -qiE 'unauthorized|forbidden|403|401|invalid token|token (expired|rejected)'; then
              if [ "$TRUSTED_PUBLISHING" = success ]; then
                echo "::error title=crates.io credentials rejected::crates.io rejected the trusted publishing (OIDC) token."
                echo ""
                echo "How to fix:"
                echo "  1. Check the trusted publisher at ${SETTINGS} (Trusted Publishing)."
                echo "     It must read: ${PUBLISHER}."
                echo "  2. Re-run this workflow. Docs: https://crates.io/docs/trusted-publishing"
              else
                echo "::error title=crates.io credentials rejected::crates.io rejected CARGO_REGISTRY_TOKEN (trusted publishing was unavailable)."
                echo ""
                echo "How to fix (either one is enough; trusted publishing is preferred):"
                echo "  1. Register the trusted publisher so no token is needed: as a crate owner open"
                echo "     ${SETTINGS} -> Trusted Publishing -> Add -> GitHub"
                echo "     and enter: ${PUBLISHER}."
                echo "     Docs: https://crates.io/docs/trusted-publishing"
                echo "  2. Or rotate the token, which may have expired or been revoked, at"
                echo "     https://crates.io/settings/tokens (scope 'publish-update' for this crate)"
                echo "     and update Settings -> Secrets and variables -> Actions -> CARGO_REGISTRY_TOKEN."
              fi
              echo ""
              echo "See docs/case-studies/issue-75/README.md and docs/case-studies/issue-29/README.md."
            fi
            exit 1
          fi
          echo "$OUT"

      - name: Verify crate on crates.io
        # Issue #41: Rust was the only language that published without ever
        # reading the result back, so a rejected or half-completed upload would
        # still have produced a green run, a git tag and a GitHub release for a
        # version nobody can depend on. JavaScript, Python and C# all verify;
        # now Rust does too.
        if: steps.release_check.outputs.should_release == 'true'
        env:
          REGISTRY_WAIT_VERBOSE: '0'
        run: |
          CRATE=$(sed -n 's|^name = "\(.*\)"|\1|p' rust/Cargo.toml | head -1)
          VER=$(sed -n 's|^version = "\(.*\)"|\1|p' rust/Cargo.toml | head -1)
          node scripts/wait-for-registry.mjs \
            --registry crates --name "$CRATE" --version "$VER"

      - name: Create GitHub Release
        if: steps.release_check.outputs.should_release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CURRENT_VERSION: ${{ steps.current_version.outputs.version }}
        working-directory: ./rust
        run: |
          node scripts/create-github-release.mjs \
            --version "${CURRENT_VERSION}" \
            --repository "${GITHUB_REPOSITORY}" \
            --tag-prefix "rust_v" \
            --language "Rust"

  # === MANUAL INSTANT RELEASE ===
  # Manual release via workflow_dispatch - only after CI passes
  manual-release:
    timeout-minutes: 60
    # Writer: every job in the repository that pushes commits, tags or
    # packages shares this group, so releases queue instead of racing, and a
    # started release is never cancelled mid-publish.
    concurrency:
      group: main-writer-${{ github.repository }}
      cancel-in-progress: false
      queue: max
    name: Instant Release
    needs: [lint, test, build]
    if: >-
      ${{
      !cancelled() &&
      github.event_name == 'workflow_dispatch' &&
      github.event.inputs.release_mode == 'instant' &&
      needs.build.result == 'success'
      }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      # crates.io trusted publishing (issue #73): the auth step below trades
      # this job's GitHub OIDC token for a short-lived publish token.
      id-token: write
    steps:
      # This job writes to the repository (a release commit and tag, or a
      # release PR branch), so the checkout explicitly persists credentials.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master branch @ 2026-10-16
        with:
          # The `stable` branch ref supplied this default; it is restated because
          # the action is hash-pinned to a master commit (issue #75: the stable
          # branch is rebuilt per release, so its old commits turn unreachable).
          toolchain: stable

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Configure git
        working-directory: ./rust
        run: node scripts/git-config.mjs

      - name: Collect changelog fragments
        working-directory: ./rust
        run: node scripts/collect-changelog.mjs

      - name: Version and commit
        id: version
        working-directory: ./rust
        env:
          BUMP_TYPE: ${{ github.event.inputs.bump_type }}
          DESCRIPTION: ${{ github.event.inputs.description }}
        run: node scripts/version-and-commit.mjs --bump-type "${BUMP_TYPE}" --description "${DESCRIPTION}"

      - name: Build release
        if: steps.version.outputs.version_committed == 'true' || steps.version.outputs.already_released == 'true'
        working-directory: ./rust
        run: cargo build --release

      # Issue #73, organization policy: trusted publishing (OIDC) first, the
      # token secret only as a fallback. The exchange fails while crates.io has
      # no trusted publisher for this repository and rust.yml; continue-on-error
      # lets the publish step fall back to CARGO_REGISTRY_TOKEN / CARGO_TOKEN,
      # and that step still fails when neither credential works, so nothing is
      # masked. The action's post step revokes the temporary token.
      - name: Authenticate with crates.io (trusted publishing)
        id: crates_auth
        if: steps.version.outputs.version_committed == 'true' || steps.version.outputs.already_released == 'true'
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
        continue-on-error: true

      - name: Publish to crates.io
        if: steps.version.outputs.version_committed == 'true' || steps.version.outputs.already_released == 'true'
        working-directory: ./rust
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates_auth.outputs.token || secrets.CARGO_REGISTRY_TOKEN || secrets.CARGO_TOKEN }}
          TRUSTED_PUBLISHING: ${{ steps.crates_auth.outcome }}
        run: |
          CRATE=$(sed -n 's|^name = "\(.*\)"|\1|p' Cargo.toml | head -1)
          SETTINGS="https://crates.io/crates/${CRATE}/settings"
          PUBLISHER="owner ${GITHUB_REPOSITORY%%/*}, repository ${GITHUB_REPOSITORY#*/}, workflow rust.yml, no environment"
          if [ "$TRUSTED_PUBLISHING" = success ]; then
            echo "Publishing with a crates.io trusted publishing (OIDC) token."
          else
            echo "::warning title=crates.io trusted publishing unavailable::OIDC token exchange outcome: ${TRUSTED_PUBLISHING:-skipped}. Falling back to the CARGO_REGISTRY_TOKEN / CARGO_TOKEN secret. To publish without a long-lived token, register the trusted publisher at ${SETTINGS} (Trusted Publishing -> Add -> GitHub: ${PUBLISHER})."
          fi
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then
            echo "::error title=crates.io credentials missing::Cannot publish to crates.io: trusted publishing is unavailable and no token secret is set."
            echo ""
            echo "How to fix (either one is enough; trusted publishing is preferred):"
            echo "  1. Trusted publishing, with no secret to rotate: as a crate owner open"
            echo "     ${SETTINGS} -> Trusted Publishing -> Add -> GitHub"
            echo "     and enter: ${PUBLISHER}."
            echo "     Docs: https://crates.io/docs/trusted-publishing"
            echo "  2. Token fallback: generate a token at https://crates.io/settings/tokens"
            echo "     (scope 'publish-update' for this crate) and add it to this repo at"
            echo "     Settings -> Secrets and variables -> Actions -> New repository secret"
            echo "     Name: CARGO_REGISTRY_TOKEN  (CARGO_TOKEN is also accepted as a fallback)"
            echo "  3. Re-run this workflow."
            echo ""
            echo "See docs/case-studies/issue-75/README.md (trusted publishing),"
            echo "    docs/case-studies/issue-29/README.md (credentials) and"
            echo "    docs/case-studies/issue-25/README.md (publishing pipeline)."
            exit 1
          fi
          if ! OUT=$(cargo publish 2>&1); then
            echo "$OUT"
            if echo "$OUT" | grep -qE 'already (uploaded|exists)'; then
              echo "::warning::Version is already on crates.io; treating manual re-run as success."
              exit 0
            fi
            if echo "$OUT" | grep -qiE 'unauthorized|forbidden|403|401|invalid token|token (expired|rejected)'; then
              if [ "$TRUSTED_PUBLISHING" = success ]; then
                echo "::error title=crates.io credentials rejected::crates.io rejected the trusted publishing (OIDC) token."
                echo ""
                echo "How to fix:"
                echo "  1. Check the trusted publisher at ${SETTINGS} (Trusted Publishing)."
                echo "     It must read: ${PUBLISHER}."
                echo "  2. Re-run this workflow. Docs: https://crates.io/docs/trusted-publishing"
              else
                echo "::error title=crates.io credentials rejected::crates.io rejected CARGO_REGISTRY_TOKEN (trusted publishing was unavailable)."
                echo ""
                echo "How to fix (either one is enough; trusted publishing is preferred):"
                echo "  1. Register the trusted publisher so no token is needed: as a crate owner open"
                echo "     ${SETTINGS} -> Trusted Publishing -> Add -> GitHub"
                echo "     and enter: ${PUBLISHER}."
                echo "     Docs: https://crates.io/docs/trusted-publishing"
                echo "  2. Or rotate the token, which may have expired or been revoked, at"
                echo "     https://crates.io/settings/tokens (scope 'publish-update' for this crate)"
                echo "     and update Settings -> Secrets and variables -> Actions -> CARGO_REGISTRY_TOKEN."
              fi
              echo ""
              echo "See docs/case-studies/issue-75/README.md and docs/case-studies/issue-29/README.md."
            fi
            exit 1
          fi
          echo "$OUT"

      - name: Verify crate on crates.io
        if: steps.version.outputs.version_committed == 'true' || steps.version.outputs.already_released == 'true'
        env:
          REGISTRY_WAIT_VERBOSE: '0'
          NEW_VERSION: ${{ steps.version.outputs.new_version }}
        run: |
          CRATE=$(sed -n 's|^name = "\(.*\)"|\1|p' rust/Cargo.toml | head -1)
          node scripts/wait-for-registry.mjs --registry crates \
            --name "$CRATE" --version "${NEW_VERSION}"

      - name: Create GitHub Release
        if: steps.version.outputs.version_committed == 'true' || steps.version.outputs.already_released == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEW_VERSION: ${{ steps.version.outputs.new_version }}
        working-directory: ./rust
        run: |
          node scripts/create-github-release.mjs \
            --version "${NEW_VERSION}" \
            --repository "${GITHUB_REPOSITORY}" \
            --tag-prefix "rust_v" \
            --language "Rust"

  # === MANUAL CHANGELOG PR ===
  changelog-pr:
    timeout-minutes: 20
    # Writer: every job in the repository that pushes commits, tags or
    # packages shares this group, so releases queue instead of racing, and a
    # started release is never cancelled mid-publish.
    concurrency:
      group: main-writer-${{ github.repository }}
      cancel-in-progress: false
      queue: max
    name: Create Changelog PR
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.release_mode == 'changelog-pr'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    steps:
      # This job writes to the repository (a release commit and tag, or a
      # release PR branch), so the checkout explicitly persists credentials.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Create changelog fragment
        working-directory: ./rust
        env:
          BUMP_TYPE: ${{ github.event.inputs.bump_type }}
          DESCRIPTION: ${{ github.event.inputs.description }}
        run: |
          # Create timestamp for unique filename
          TIMESTAMP=$(date +"%Y%m%d_%H%M%S")
          FILENAME="changelog.d/${TIMESTAMP}_manual_release.md"

          # Create the changelog fragment
          cat > "$FILENAME" << EOF
          ---
          bump: ${BUMP_TYPE}
          ---

          ${DESCRIPTION:-Manual release}
          EOF

          echo "Created changelog fragment: $FILENAME"

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'chore: add changelog for manual ${{ github.event.inputs.bump_type }} release'
          branch: changelog-manual-release-${{ github.run_id }}
          delete-branch: true
          title: 'chore: manual ${{ github.event.inputs.bump_type }} release (Rust)'
          body: |
            ## Manual Release Request (Rust)

            This PR was created by a manual workflow trigger to prepare a **${{ github.event.inputs.bump_type }}** release for the Rust package.

            ### Release Details
            - **Type:** ${{ github.event.inputs.bump_type }}
            - **Description:** ${{ github.event.inputs.description || 'Manual release' }}
            - **Triggered by:** @${{ github.actor }}

            ### Next Steps
            1. Review the changelog fragment in this PR
            2. Merge this PR to main
            3. The automated release workflow will publish to crates.io and create a GitHub release
