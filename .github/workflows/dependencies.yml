name: Dependency Freshness

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

# CI/CD best practice #17 (issue #71): "a newer version was published" is a
# fact about the world, not about the commit. Pull requests (and a manual
# dispatch) gate on it; push and the weekly schedule only warn, so a fresh
# upstream release can no longer turn main red for a commit that broke nothing.
env:
  FRESHNESS_MODE: ${{ (github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch') && 'gate' || 'report' }}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  direct:
    name: Direct dependencies are current
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.15.2'
      - name: Test freshness gate, including blocker policy
        run: python -m unittest discover -s scripts -p 'test_dependency_freshness.py' -v
      - name: Check latest releases across all four ecosystems
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/check_dependency_freshness.py

  locks:
    name: Lockfiles have no pending compatible updates
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '26.13.1'
          package-manager-cache: false

      - name: Install locked release tools and npm
        shell: bash
        run: |
          npm ci --ignore-scripts
          echo "$GITHUB_WORKSPACE/node_modules/.bin" >> "$GITHUB_PATH"

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master branch @ 2026-10-16
        with:
          # The `stable` branch ref supplied this default; it is restated because
          # the action is hash-pinned to a master commit (issue #75: the stable
          # branch is rebuilt per release, so its old commits turn unreachable).
          toolchain: '1.100.0'
      - name: Check npm resolved versions
        run: |
          npm ci --prefix js
          if ! { npm outdated && npm outdated --prefix js; }; then
            if [ "$FRESHNESS_MODE" = report ]; then
              echo '::warning title=Stale npm lockfile::npm lockfiles have newer direct releases available; run npm update.'
            else
              echo '::error title=Stale npm lockfile::npm lockfiles have newer direct releases available; run npm update.'
              exit 1
            fi
          fi
      - name: Check every Cargo lockfile
        run: |
          while IFS= read -r lock; do
            manifest="${lock%Cargo.lock}Cargo.toml"
            cargo update --manifest-path "$manifest" --dry-run 2>&1 | tee cargo-update.log
            if grep -E '^[[:space:]]*(Updating .+ ->|Adding |Removing |Locking [1-9])' cargo-update.log; then
              if [ "$FRESHNESS_MODE" = report ]; then
                echo "::warning title=Stale Cargo lockfile::$lock has pending updates; run cargo update."
              else
                echo "::error title=Stale Cargo lockfile::$lock has pending updates; run cargo update."
                exit 1
              fi
            fi
          done < <(git ls-files 'rust/Cargo.lock' 'experiments/**/Cargo.lock')
