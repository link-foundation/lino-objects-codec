name: Dependency Freshness

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

# CI/CD best practice #17 (issue #71): "a newer version was published" is a
# fact about the world, not about the commit. Pull requests (and a manual
# dispatch) gate on it; push and the weekly schedule only warn, so a fresh
# upstream release can no longer turn main red for a commit that broke nothing.
env:
  FRESHNESS_MODE: ${{ (github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch') && 'gate' || 'report' }}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  direct:
    name: Direct dependencies are current
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Test freshness gate, including blocker policy
        run: python -m unittest discover -s scripts -p 'test_dependency_freshness.py' -v
      - name: Check latest releases across all four ecosystems
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/check_dependency_freshness.py

  locks:
    name: Lockfiles have no pending compatible updates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
      - name: Check npm resolved versions
        working-directory: js
        run: |
          npm ci
          if ! npm outdated; then
            if [ "$FRESHNESS_MODE" = report ]; then
              echo '::warning title=Stale npm lockfile::js/package-lock.json has newer releases available; run npm update.'
            else
              echo '::error title=Stale npm lockfile::js/package-lock.json has newer releases available; run npm update.'
              exit 1
            fi
          fi
      - name: Check Cargo lockfile
        working-directory: rust
        run: |
          cargo update --dry-run 2>&1 | tee cargo-update.log
          if grep -E '^[[:space:]]*(Updating .+ ->|Adding |Removing |Locking [1-9])' cargo-update.log; then
            if [ "$FRESHNESS_MODE" = report ]; then
              echo '::warning title=Stale Cargo lockfile::Cargo.lock has pending updates; run cargo update.'
            else
              echo '::error title=Stale Cargo lockfile::Cargo.lock has pending updates; run cargo update.'
              exit 1
            fi
          fi
