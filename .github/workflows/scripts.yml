name: Shared CI Scripts

# The repository-level `scripts/` directory holds helpers that every language's
# pipeline depends on: the cross-language parity gate and the post-publish
# registry readback. Until issue #41 the only thing that ran their tests was the
# parity workflow, which is pull-request-only and named a single test file, so a
# broken helper could reach `main` untested and only surface during a release.
#
# This workflow runs every `scripts/*.test.mjs`, on pull requests and on pushes
# to `main`. It has no `paths:` filter on purpose — a change anywhere can break
# a shared helper, and a filtered workflow is a check that silently does not run.

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

# Least privilege: this workflow only ever reads the repository.
permissions:
  contents: read

jobs:
  test:
    name: Test Shared Scripts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Read-only checks, so superseded runs are safe to cancel.
    concurrency:
      group: check-${{ github.workflow }}-${{ github.ref }}-test
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Run shared script tests
        run: node --test scripts/*.test.mjs

  actionlint:
    name: Lint Workflows
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: check-${{ github.workflow }}-${{ github.ref }}-actionlint
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7

      # A malformed workflow file is rejected by GitHub at dispatch time with no
      # check attached to the pull request, i.e. a silent false negative: the PR
      # looks green while a pipeline no longer runs at all. actionlint parses
      # every workflow and also catches shell-injection and stale-context bugs.
      - name: Run actionlint
        env:
          ACTIONLINT_VERSION: 1.7.7
        run: |
          curl -sSfL \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            | tar xz actionlint
          # `queue:` is valid workflow syntax (documented under `concurrency`)
          # but is newer than actionlint's bundled schema, so it is filtered out.
          ./actionlint -ignore 'unexpected key "queue" for "concurrency" section'
