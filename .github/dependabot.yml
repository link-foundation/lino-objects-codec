# Keep parser versions and direct dependency freshness aligned across languages.
# A single weekly PR can carry the coordinated parser upgrade and release fragments.
version: 2

multi-ecosystem-groups:
  all-dependencies:
    schedule:
      interval: weekly

updates:
  - package-ecosystem: cargo
    directories:
      - /rust
      - /experiments/issue-37/parenthesis-indentation
      - /experiments/issue-43/line-format-probe
      - /experiments/issue-45/quote-probe
      - /experiments/issue-47/rust-interop
      - /experiments/issue-65/consumer
    patterns: ['*']
    multi-ecosystem-group: all-dependencies

  - package-ecosystem: npm
    directories:
      - /js
    patterns: ['*']
    multi-ecosystem-group: all-dependencies

  - package-ecosystem: pip
    directories:
      - /python
    patterns: ['*']
    multi-ecosystem-group: all-dependencies

  - package-ecosystem: nuget
    directories:
      - /csharp
    patterns: ['*']
    multi-ecosystem-group: all-dependencies

  - package-ecosystem: github-actions
    directories:
      - /
    patterns: ['*']
    multi-ecosystem-group: all-dependencies
